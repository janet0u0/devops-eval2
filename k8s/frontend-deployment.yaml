apiVersion: apps/v1
kind: Deployment
metadata:
  name: innovatech-frontend
  namespace: innovatech
spec:
  replicas: 2
  selector:
    matchLabels:
      app: innovatech-frontend
  template:
    metadata:
      labels:
        app: innovatech-frontend
    spec:
      containers:
        - name: frontend
          image: 708837434644.dkr.ecr.us-east-1.amazonaws.com/innovatech-frontend:eks-v1 # Colocar URI real de tu imagen en ECR
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10