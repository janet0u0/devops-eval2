name: cicd_backends

on:
  push:
    branches: ["deploy"]
    paths:
      - "back-Ventas_SpringBoot/**"
      - "back-Despachos_SpringBoot/**"

  workflow_dispatch:

jobs:
  build-push-deploy-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      # =========================
      # BACKEND DESPACHOS
      # =========================
      - name: Copiar código Despachos a EC2 vía S3
        run: |
          zip -r despachos.zip back-Despachos_SpringBoot/
          aws s3 cp despachos.zip s3://${{ secrets.S3_BUCKET }}/despachos.zip

      - name: Build y Deploy Despachos en EC2 vía SSM
        run: |
          aws ssm send-command \
            --instance-ids ${{ secrets.EC2_BACKEND_INSTANCE_ID }} \
            --document-name AWS-RunShellScript \
            --comment "Build y deploy despachos" \
            --parameters 'commands=[
              "aws s3 cp s3://${{ secrets.S3_BUCKET }}/despachos.zip /home/ec2-user/despachos.zip",
              "unzip -o /home/ec2-user/despachos.zip -d /home/ec2-user/",
              "cd /home/ec2-user/back-Despachos_SpringBoot && docker build -t back-despachos .",
              "docker stop back-despachos || true",
              "docker rm back-despachos || true",
              "docker run -d --name back-despachos -p 8080:8080 back-despachos:latest"
            ]'

      # =========================
      # BACKEND VENTAS
      # =========================
      - name: Copiar código Ventas a EC2 vía S3
        run: |
          zip -r ventas.zip back-Ventas_SpringBoot/
          aws s3 cp ventas.zip s3://${{ secrets.S3_BUCKET }}/ventas.zip

      - name: Build y Deploy Ventas en EC2 vía SSM
        run: |
          aws ssm send-command \
            --instance-ids ${{ secrets.EC2_BACKEND_INSTANCE_ID }} \
            --document-name AWS-RunShellScript \
            --comment "Build y deploy ventas" \
            --parameters 'commands=[
              "aws s3 cp s3://${{ secrets.S3_BUCKET }}/ventas.zip /home/ec2-user/ventas.zip",
              "unzip -o /home/ec2-user/ventas.zip -d /home/ec2-user/",
              "cd /home/ec2-user/back-Ventas_SpringBoot && docker build -t back-ventas .",
              "docker stop back-ventas || true",
              "docker rm back-ventas || true",
              "docker run -d --name back-ventas -p 8081:8080 back-ventas:latest"
            ]'