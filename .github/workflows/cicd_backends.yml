name: cicd_backends

on:
  push:
    branches: ["deploy"]
    paths:
      - "back-Ventas_SpringBoot/**"
      - "back-Despachos_SpringBoot/**"

  workflow_dispatch:

jobs:
  build-push-deploy-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login en Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # =========================
      # BACKEND DESPACHOS
      # =========================
      - name: Build Backend Despachos
        run: |
          cd back-Despachos_SpringBoot
          ls
          docker build -t innovatech-backend-despachos .
          docker tag innovatech-backend-despachos:latest ${{ secrets.ECR_REPO_URL_BACKEND }}-despachos:latest
          docker push ${{ secrets.ECR_REPO_URL_BACKEND }}-despachos:latest

      - name: Deploy Backend Despachos vía SSM
        run: |
          aws ssm send-command \
            --instance-ids ${{ secrets.EC2_BACKEND_INSTANCE_ID }} \
            --document-name AWS-RunShellScript \
            --comment "Deploy backend despachos" \
            --parameters 'commands=[
              "aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}",
              "docker pull ${{ secrets.ECR_REPO_URL_BACKEND }}-despachos:latest",
              "docker stop back-despachos || true",
              "docker rm back-despachos || true",
              "docker run -d --name back-despachos -p 8080:8080 ${{ secrets.ECR_REPO_URL_BACKEND }}-despachos:latest"
            ]'