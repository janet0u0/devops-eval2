services:
  # Base de Datos Única
  database:
    image: mysql:8.0
    container_name: mysql-global
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-innovatech_db}
    ports:
      - '3306:3306'
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - innovatech-network

  # Microservicio de Ventas
  ventas:
    build:
      context: ./back-Ventas_SpringBoot/Springboot-API-REST
    container_name: back-ventas
    ports:
      - '8080:8080'
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://database:3306/${DB_NAME:-innovatech_db}?allowPublicKeyRetrieval=true&useSSL=false
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-root}
    depends_on:
      - database
    networks:
      - innovatech-network

  # Microservicio de Despachos
  despachos:
    build:
      context: ./back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
    container_name: back-despachos
    ports:
      - '8081:8080'
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://database:3306/${DB_NAME:-innovatech_db}?allowPublicKeyRetrieval=true&useSSL=false
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-root}
    depends_on:
      - database
    networks:
      - innovatech-network

volumes:
  db_data:

networks:
  innovatech-network:
    driver: bridge
